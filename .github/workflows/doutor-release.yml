name: doutor-release

# Windows build of the Doutor Repair fork (recovery-mode restores, external
# restore-mode watcher, 64 MB main-thread stack). Tag `dr-v<version>`, e.g.
# `dr-v0.5.11-dr.2`; the archive follows upstream's GoReleaser naming.
on:
  push:
    tags: ["dr-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            git
            make
            autoconf
            automake
            libtool
            autoconf-archive
            gettext-devel
            pkgconf
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-nasm
      - name: Install Rust toolchain (windows-gnu)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --locked -p restorekit-cli --target x86_64-pc-windows-gnu
      - name: Stage artifact
        shell: msys2 {0}
        run: |
          mkdir -p artifacts/restorekit_windows_amd64
          cp target/x86_64-pc-windows-gnu/release/restorekit.exe artifacts/restorekit_windows_amd64/restorekit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: restorekit_windows_amd64
          path: artifacts/restorekit_windows_amd64
          if-no-files-found: error

  release:
    needs: [build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: restorekit_windows_amd64
          path: artifacts/restorekit_windows_amd64
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#dr-v}"
          d="pkg/restorekit_${version}_windows_amd64"
          mkdir -p "$d" dist
          cp artifacts/restorekit_windows_amd64/restorekit.exe LICENSE NOTICE README.md "$d/"
          (cd "$d" && zip -q "../../dist/restorekit_${version}_windows_amd64.zip" *)
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Doutor Repair Windows build of restorekit: restore/revive from recovery mode (with --ecid), RESTOREKIT_EXTERNAL_RESTORE_WATCHER=1 to skip the late UAC watcher, 64 MB main-thread stack. Source: this tag."
