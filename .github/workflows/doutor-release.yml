name: doutor-release

# Builds of the Doutor Repair fork (recovery-mode restores, external restore-mode
# watcher, 64 MB main-thread stack on Windows). Tag `dr-v<version>`, e.g.
# `dr-v0.5.11-dr.1`; archives follow upstream's GoReleaser naming.
on:
  push:
    tags: ["dr-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            goarch: arm64
          - os: macos-15-intel
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install macOS build deps
        run: brew install autoconf automake libtool pkg-config cmake autoconf-archive
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Build
        run: cargo build --release --locked -p restorekit-cli
      - name: Stage artifact
        run: |
          mkdir -p artifacts/restorekit_darwin_${{ matrix.goarch }}
          cp target/release/restorekit artifacts/restorekit_darwin_${{ matrix.goarch }}/restorekit
      - uses: actions/upload-artifact@v4
        with:
          name: restorekit_darwin_${{ matrix.goarch }}
          path: artifacts/restorekit_darwin_${{ matrix.goarch }}
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            base-devel
            git
            make
            autoconf
            automake
            libtool
            autoconf-archive
            gettext-devel
            pkgconf
            perl
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-nasm
      - name: Install Rust toolchain (windows-gnu)
        shell: bash
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal --no-self-update
          rustup default stable-x86_64-pc-windows-gnu
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="/c/Users/runneradmin/.cargo/bin:$PATH"
          cargo build --release --locked -p restorekit-cli --target x86_64-pc-windows-gnu
      - name: Stage artifact
        shell: msys2 {0}
        run: |
          mkdir -p artifacts/restorekit_windows_amd64
          cp target/x86_64-pc-windows-gnu/release/restorekit.exe artifacts/restorekit_windows_amd64/restorekit.exe
      - uses: actions/upload-artifact@v4
        with:
          name: restorekit_windows_amd64
          path: artifacts/restorekit_windows_amd64
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: restorekit_*
      - name: Package
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#dr-v}"
          mkdir -p dist
          for plat in darwin_arm64 darwin_amd64; do
            d="pkg/restorekit_${version}_${plat}"
            mkdir -p "$d"
            cp "artifacts/restorekit_${plat}/restorekit" "$d/"
            chmod +x "$d/restorekit"
            cp LICENSE NOTICE README.md "$d/"
            tar -C "$d" -czf "dist/restorekit_${version}_${plat}.tar.gz" .
          done
          d="pkg/restorekit_${version}_windows_amd64"
          mkdir -p "$d"
          cp artifacts/restorekit_windows_amd64/restorekit.exe LICENSE NOTICE README.md "$d/"
          (cd "$d" && zip -q "../../dist/restorekit_${version}_windows_amd64.zip" *)
          (cd dist && sha256sum * > checksums.txt && cat checksums.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Doutor Repair build of restorekit: restore/revive from recovery mode (with --ecid), RESTOREKIT_EXTERNAL_RESTORE_WATCHER=1 to skip the late UAC watcher, 64 MB main-thread stack on Windows. Source: this tag."
